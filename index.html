<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dan rojstnega dne</title>

  <style>
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;

      background:
        linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
        url("image004.jpg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* slika na levi */
    .left-image {
      position: fixed;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      height: 70vh;
      max-width: 40vw;
      object-fit: contain;
      opacity: 0.9;
      pointer-events: none;
    }

    /* kartica */
    .card {
      backdrop-filter: blur(6px);
      background: rgba(255,255,255,0.92);

      padding: 32px;
      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
    }

    p {
      color: #555;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 12px;
      border: 1px solid #ccc;
      margin-top: 12px;
      outline: none;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      background: #667eea;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #5a67d8;
    }

    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      font-weight: bold;
      display: none;
    }

    .ok {
      background: #d1fae5;
      color: #065f46;
    }

    .err {
      background: #fee2e2;
      color: #7f1d1d;
    }

  
   
  </style>
</head>

<body>
  <img src="loveslika.jpg" class="left-image" alt="">

  <div class="card">
    <h1>Dan rojstnega dne</h1>
    <p>Vpiši datum rojstva in izveš, kateri dan v tednu je bil.</p>

    <input id="datum" type="date">
    <button onclick="izracunaj()">Izračunaj</button>

    <div id="rezultat" class="result"></div>
  </div>

  <script>
    const dnevi = [
      "NEDELJA",
      "PONEDELJEK",
      "TOREK",
      "SREDA",
      "ČETRTEK",
      "PETEK",
      "SOBOTA"
    ];

    function izracunaj() {
      const input = document.getElementById("datum").value;
      const out = document.getElementById("rezultat");

      if (!input) {
        out.textContent = "Prosim, izberi datum.";
        out.className = "result err";
        out.style.display = "block";
        return;
      }

      const d = new Date(input + "T00:00:00");
      const dan = dnevi[d.getDay()];

      out.textContent = "To je bil " + dan + ".";
      out.className = "result ok";
      out.style.display = "block";
    }
  </script>
</body>
</html>
